services:
  dynamodb:
    image: amazon/dynamodb-local:3.3.2
    user: root
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /data
    volumes: [dynamodb:/data]
    ports: ["8000:8000"]

  api:
    build: .
    depends_on: [dynamodb]
    ports: ["8787:8787"]
    environment:
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_PROFILE: ${AWS_PROFILE:-default}
      AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb:8000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      LLM: ${LLM:-offline}
      AUTH: "off"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      AGENT_URL: http://agent:8790
    volumes: ["${HOME}/.aws:/root/.aws:ro"]

  agent:
    build: ./agent
    depends_on: [api]
    environment:
      API_URL: http://api:8787
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_PROFILE: ${AWS_PROFILE:-default}
      LLM: ${LLM:-offline}
      AGENT_DATA: /data
    volumes: ["agent:/data", "${HOME}/.aws:/root/.aws:ro"]

volumes:
  dynamodb:
  agent:
